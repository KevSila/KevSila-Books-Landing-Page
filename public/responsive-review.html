<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive review</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #2b2927; color: white; font: 600 14px Arial, sans-serif; }
      main { display: grid; gap: 32px; justify-content: center; }
      section { display: grid; gap: 10px; }
      iframe { display: block; max-width: 100%; border: 2px solid #817a72; border-radius: 12px; background: white; }
    </style>
  </head>
  <body>
    <main>
      <section><span>Phone · 390 × 844</span><iframe src="/" width="390" height="844"></iframe></section>
      <section><span>Tablet portrait · 768 × 1024</span><iframe src="/" width="768" height="1024"></iframe></section>
      <section><span>Phone book page · 390 × 844</span><iframe src="/the-firelit-mind/" width="390" height="844"></iframe></section>
      <section><span>Tablet book page · 768 × 1024</span><iframe src="/the-firelit-mind/" width="768" height="1024"></iframe></section>
    </main>
  </body>
</html>
